name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Accept SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install SDK components
        run: |
          SDK=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          yes | $SDK "platforms;android-37" "build-tools;37.0.0" > /dev/null

      - name: Install Gradle 9.9.1 (wrapper jar not in repo)
        run: |
          curl -sSLo /tmp/gradle.zip https://services.gradle.org/distributions/gradle-9.9.1-bin.zip
          unzip -q /tmp/gradle.zip -d /opt
          ln -s /opt/gradle-9.9.1/bin/gradle /usr/local/bin/gradle

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mingxin-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release create "${GITHUB_REF_NAME}" app/build/outputs/apk/debug/app-debug.apk \
            --title "明心 · 费曼佛法 ${GITHUB_REF_NAME}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
